# billing: push the night's Postgres dumps + Storage bytes to b2:almogbilling-backup:supabase.
# No secrets here — they come from ENV_FILE.
ENV_FILE=/etc/billing/backup.env
HC_URL_VAR=HEALTHCHECK_BACKUP_URL

# The dump of THIS night must exist before pushing. pg-backup.sh is local and needs no
# network, so when it is missing (it normally ran at 03:00) it is produced first.
read -r -d '' CMD <<'EOF'
dir="${BACKUP_DIR:-/var/backups/supabase/daily}"
if ! compgen -G "$dir/cluster-$(date +%Y%m%d)-*.sql.gz" >/dev/null; then
  echo "[backup-retry] no cluster dump from today in $dir — running pg-backup.sh first (local only)"
  /var/www/billing/scripts/backup/pg-backup.sh || exit 1
fi
exec /var/www/billing/scripts/backup/restic-push.sh
EOF

# Success = both snapshots exist in B2 and are from today.
VERIFY='/usr/local/bin/backup-verify-restic.sh supabase-daily storage'
