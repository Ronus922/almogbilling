# 2026-10-23: the nightly run goes through the retry wrapper, so an outage does not skip
# the night. Schedule (billing-backup.timer) unchanged. pg-backup.sh stays first: it is
# local and does not need the network. Only the off-site push is retried.
[Service]
ExecStart=
ExecStart=/var/www/billing/scripts/backup/pg-backup.sh
ExecStart=/usr/local/bin/backup-retry.sh run restic-push
# pg-backup + the 4 h retry window
TimeoutStartSec=5h
