name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0
  NODE_ENV: test

jobs:
  check:
    name: check:all
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billing
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/billing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply migrations (up files, lexicographic — same order as production)
        run: |
          for f in $(ls supabase/migrations/*.sql | grep -v '\.down\.sql$' | LC_ALL=C sort); do
            psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f "$f"
          done

      - run: npm run check:all
